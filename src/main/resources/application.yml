spring:
  application.name: ledgerforge
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/ledgerforge}
    username: ${DATABASE_USER:ledgerforge_app}
    password: ${DATABASE_PASSWORD:ledgerforge_app}
  flyway:
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
ledgerforge:
  jwt-secret: ${JWT_SECRET:local-ledgerforge-signing-secret-change-me-32-bytes}
  webhook-tolerance-seconds: ${WEBHOOK_TOLERANCE_SECONDS:300}
