name: ledgerforge
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerforge
      POSTGRES_USER: ledgerforge_app
      POSTGRES_PASSWORD: ledgerforge_app
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerforge_app -d ledgerforge"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/ledgerforge
      DATABASE_USER: ledgerforge_app
      DATABASE_PASSWORD: ledgerforge_app
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  dashboard:
    build:
      context: ./dashboard
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8080" }
    ports: ["127.0.0.1:3002:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data: {}
